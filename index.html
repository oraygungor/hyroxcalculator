<!DOCTYPE html>
<html lang="tr" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HYROX SIM</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: '#ffe600',
                    },
                    fontFamily: {
                        sans: ['ui-sans-serif', 'system-ui', '-apple-system', 'BlinkMacSystemFont', 'Segoe UI', 'Roboto', 'Helvetica Neue', 'Arial', 'sans-serif'],
                        mono: ['ui-monospace', 'SFMono-Regular', 'Menlo', 'Monaco', 'Consolas', 'Liberation Mono', 'Courier New', 'monospace'],
                    }
                }
            }
        }
    </script>
    <style>
        body {
            background-color: #000000;
            color: #ffffff;
            font-family: sans-serif;
        }
        
        /* Custom Range Slider Styling */
        input[type=range] {
            -webkit-appearance: none;
            width: 100%;
            background: transparent;
        }

        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 16px;
            width: 16px;
            border-radius: 50%;
            background: #ffe600;
            cursor: pointer;
            margin-top: -6px;
            box-shadow: 0 0 2px rgba(0,0,0,0.5);
        }

        input[type=range]::-webkit-slider-runnable-track {
            width: 100%;
            height: 4px;
            cursor: pointer;
            background: #374151;
            border-radius: 2px;
        }

        input[type=range]:focus {
            outline: none;
        }

        /* Selection Color */
        ::selection {
            background: #ffe600;
            color: #000;
        }

        /* Accordion Transitions */
        .accordion-content {
            transition: max-height 0.3s ease-in-out, opacity 0.3s ease-in-out;
            overflow: hidden;
            max-height: 0;
            opacity: 0;
        }
        .accordion-content.open {
            max-height: 2000px; /* Arbitrary large height */
            opacity: 1;
        }
        
        .chevron {
            transition: transform 0.3s ease;
        }
        .chevron.rotate {
            transform: rotate(180deg);
        }
    </style>
</head>
<body class="min-h-screen selection:bg-brand selection:text-black">

    <div class="max-w-7xl mx-auto px-4 py-8">
        
        <div class="flex flex-col md:flex-row justify-between items-center mb-10 gap-6 border-b border-gray-800 pb-6">
            <div class="text-center md:text-left">
                <h1 class="text-4xl font-black italic tracking-tighter text-brand">
                    HYROX <span class="text-white not-italic font-normal">SIM</span>
                </h1>
                <p class="text-[10px] text-gray-500 uppercase font-bold tracking-[0.4em] mt-1">Advanced Performance Lab</p>
            </div>

            <div class="flex items-center gap-4">
                 <div class="flex bg-[#111] rounded-lg p-1 border border-gray-800">
                    <button id="btn-lang-tr" onclick="setLanguage('tr')" class="px-4 py-1.5 rounded-md text-xs font-bold transition-all bg-brand text-black shadow-lg">TR</button>
                    <button id="btn-lang-en" onclick="setLanguage('en')" class="px-4 py-1.5 rounded-md text-xs font-bold transition-all text-gray-400 hover:text-white">EN</button>
                 </div>
                 
                 <button onclick="shareState()" class="p-2 bg-[#111] rounded-lg border border-gray-800 hover:border-brand text-gray-400 hover:text-brand transition-colors relative group">
                    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="18" cy="5" r="3"></circle><circle cx="6" cy="12" r="3"></circle><circle cx="18" cy="19" r="3"></circle><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"></line><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"></line></svg>
                    <span id="share-tooltip" class="absolute -bottom-10 right-0 bg-brand text-black text-[10px] font-bold px-3 py-1.5 rounded opacity-0 transition-opacity whitespace-nowrap pointer-events-none z-50">Link Kopyalandı!</span>
                 </button>
            </div>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-12 gap-8 items-start">
            
            <div class="lg:col-span-7 space-y-2">
                
                <div class="border border-gray-800 rounded-xl bg-[#0a0a0a] overflow-hidden mb-4 transition-all hover:border-gray-700">
                    <div onclick="toggleAccordion('run-content', 'run-chevron')" class="flex items-center justify-between p-5 cursor-pointer bg-[#0a0a0a] hover:bg-[#111] transition-colors">
                        <h2 class="text-sm font-black uppercase tracking-[0.2em] text-brand flex items-center gap-3">
                           <span class="text-lg">🏃</span> <span id="lbl-runs-header">KOŞULAR (1KM x 8)</span>
                        </h2>
                        <svg id="run-chevron" class="text-gray-500 chevron rotate" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"></polyline></svg>
                    </div>
                    
                    <div id="run-content" class="accordion-content open">
                        <div class="p-5 pt-0 border-t border-gray-900/50">
                            <div class="flex gap-3 mb-6 bg-[#111] p-3 rounded-lg border border-gray-800 items-center mt-5">
                                <input type="text" id="sync-input" placeholder="06:00" class="flex-1 bg-transparent text-center text-lg py-1 border-none focus:outline-none focus:ring-0 font-mono font-bold text-white placeholder-gray-600">
                                <button onclick="syncRuns()" class="bg-brand hover:bg-yellow-400 text-black px-6 py-2 rounded-md text-xs font-black transition-all active:scale-95 uppercase tracking-wider flex items-center gap-2">
                                    <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/><path d="M8 16H3v5"/></svg> 
                                    <span id="lbl-sync-btn">EŞİTLE</span>
                                </button>
                            </div>

                            <div id="runs-container" class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                                </div>
                        </div>
                    </div>
                </div>

                <div class="border border-gray-800 rounded-xl bg-[#0a0a0a] overflow-hidden mb-4 transition-all hover:border-gray-700">
                    <div onclick="toggleAccordion('work-content', 'work-chevron')" class="flex items-center justify-between p-5 cursor-pointer bg-[#0a0a0a] hover:bg-[#111] transition-colors">
                        <h2 class="text-sm font-black uppercase tracking-[0.2em] text-brand flex items-center gap-3">
                           <span class="text-lg">🏋️</span> <span id="lbl-workouts-header">İSTASYONLAR</span>
                        </h2>
                        <svg id="work-chevron" class="text-gray-500 chevron rotate" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"></polyline></svg>
                    </div>
                    
                    <div id="work-content" class="accordion-content open">
                        <div class="p-5 pt-0 border-t border-gray-900/50">
                            <div id="workouts-container" class="grid grid-cols-1 sm:grid-cols-2 gap-4 mt-5">
                                </div>
                        </div>
                    </div>
                </div>

                <div class="border border-gray-800 rounded-xl bg-[#0a0a0a] overflow-hidden mb-4 transition-all hover:border-gray-700">
                    <div onclick="toggleAccordion('rox-content', 'rox-chevron')" class="flex items-center justify-between p-5 cursor-pointer bg-[#0a0a0a] hover:bg-[#111] transition-colors">
                        <h2 class="text-sm font-black uppercase tracking-[0.2em] text-brand flex items-center gap-3">
                           <span class="text-lg">⏱️</span> <span id="lbl-roxzone-header">ROXZONE (GEÇİŞLER)</span>
                        </h2>
                        <svg id="rox-chevron" class="text-gray-500 chevron rotate" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"></polyline></svg>
                    </div>
                    
                    <div id="rox-content" class="accordion-content open">
                        <div class="p-5 pt-0 border-t border-gray-900/50">
                            <div id="roxzone-container" class="mt-5">
                                </div>
                        </div>
                    </div>
                </div>

            </div>

            <div class="lg:col-span-5 relative">
                <div class="sticky top-8 bg-[#111] border-2 border-brand rounded-3xl p-8 shadow-2xl">
                    
                    <div class="text-center mb-10">
                        <span id="lbl-total-time" class="text-xs font-black text-gray-500 uppercase tracking-[0.3em]">TAHMİNİ BİTİŞ SÜRESİ</span>
                        <div id="val-total-time" class="font-mono text-7xl font-black text-white mt-4 tracking-tighter drop-shadow-lg">
                            00:00:00
                        </div>
                        <div id="val-total-pct" class="mt-6 inline-block px-8 py-3 rounded-full text-sm font-black bg-brand text-black shadow-[0_0_20px_rgba(255,230,0,0.2)] transform hover:scale-105 transition-transform cursor-default">
                            Genel: İlk %50.0
                        </div>
                    </div>

                    <div class="space-y-4">
                        <div class="bg-black/40 p-5 rounded-2xl flex justify-between items-center border border-gray-800">
                            <div>
                                <div id="lbl-run-total" class="text-[10px] font-black text-gray-400 uppercase tracking-[0.2em] mb-1">KOŞU TOPLAMI</div>
                                <div id="val-run-total" class="font-mono text-2xl font-bold text-white leading-none">00:00</div>
                            </div>
                            <div id="pct-run-total" class="text-xs font-black text-brand bg-[#1a1a1a] px-3 py-1.5 rounded-lg border border-gray-800">
                                %50.0
                            </div>
                        </div>

                        <div class="bg-black/40 p-5 rounded-2xl flex justify-between items-center border border-gray-800">
                            <div>
                                <div id="lbl-work-total" class="text-[10px] font-black text-gray-400 uppercase tracking-[0.2em] mb-1">İSTASYON TOPLAMI</div>
                                <div id="val-work-total" class="font-mono text-2xl font-bold text-white leading-none">00:00</div>
                            </div>
                            <div id="pct-work-total" class="text-xs font-black text-brand bg-[#1a1a1a] px-3 py-1.5 rounded-lg border border-gray-800">
                                %50.0
                            </div>
                        </div>

                        <div class="bg-black/40 p-5 rounded-2xl flex justify-between items-center border border-gray-800">
                            <div>
                                <div id="lbl-rox-total" class="text-[10px] font-black text-gray-400 uppercase tracking-[0.2em] mb-1">ROXZONE TOPLAMI</div>
                                <div id="val-rox-total" class="font-mono text-2xl font-bold text-white leading-none">00:00</div>
                            </div>
                            <div id="pct-rox-total" class="text-xs font-black text-brand bg-[#1a1a1a] px-3 py-1.5 rounded-lg border border-gray-800">
                                %50.0
                            </div>
                        </div>
                    </div>

                </div>
            </div>

        </div>
    </div>

    <script>
        // --- Data & Config ---
        const STATION_DATA = {
            run1: { default: 270, p10: 210, p90: 380, min: 180, max: 480 },
            run2: { default: 280, p10: 215, p90: 390, min: 180, max: 480 },
            run3: { default: 290, p10: 220, p90: 400, min: 180, max: 500 },
            run4: { default: 300, p10: 225, p90: 410, min: 180, max: 500 },
            run5: { default: 300, p10: 230, p90: 420, min: 180, max: 500 },
            run6: { default: 310, p10: 235, p90: 430, min: 180, max: 520 },
            run7: { default: 310, p10: 240, p90: 440, min: 180, max: 520 },
            run8: { default: 330, p10: 260, p90: 480, min: 180, max: 600 },
            ws1: { default: 265, p10: 230, p90: 290, min: 180, max: 360, label: 'SkiErg', badge: '01' },
            ws2: { default: 170, p10: 120, p90: 280, min: 60, max: 420, label: 'Sled Push', badge: '02' },
            ws3: { default: 280, p10: 200, p90: 460, min: 100, max: 600, label: 'Sled Pull', badge: '03' },
            ws4: { default: 320, p10: 230, p90: 550, min: 120, max: 720, label: 'Burpees', badge: '04' },
            ws5: { default: 285, p10: 250, p90: 320, min: 200, max: 380, label: 'Row', badge: '05' },
            ws6: { default: 120, p10: 90, p90: 180, min: 60, max: 240, label: 'Farmers', badge: '06' },
            ws7: { default: 290, p10: 200, p90: 520, min: 120, max: 720, label: 'Lunges', badge: '07' },
            ws8: { default: 380, p10: 270, p90: 620, min: 180, max: 900, label: 'Wall Balls', badge: '08' },
            roxzone: { default: 360, p10: 270, p90: 660, min: 120, max: 1200, label: 'Roxzone' },
            // Totals
            totalRun: { p10: 1800, p90: 3300 },
            totalWork: { p10: 1800, p90: 3000 },
            totalRox: { p10: 270, p90: 660 },
            totalAll: { p10: 4200, p90: 6800 }
        };

        const TRANSLATIONS = {
            tr: {
                running_header: "KOŞULAR (1KM x 8)",
                workouts_header: "İSTASYONLAR",
                roxzone_header: "ROXZONE (GEÇİŞLER)",
                sync_button: "EŞİTLE",
                total_time_label: "TAHMİNİ BİTİŞ SÜRESİ",
                total_run_label: "KOŞU TOPLAMI",
                total_workout_label: "İSTASYON TOPLAMI",
                total_roxzone_label: "ROXZONE TOPLAMI",
                overall_prefix: "Genel: İlk",
                percent_prefix: "%",
                run_label_prefix: "Run ",
                link_copied: "Link Kopyalandı!"
            },
            en: {
                running_header: "RUNS (1KM x 8)",
                workouts_header: "WORKOUTS",
                roxzone_header: "ROXZONE",
                sync_button: "SYNC",
                total_time_label: "ESTIMATED FINISH TIME",
                total_run_label: "RUN TOTAL",
                total_workout_label: "STATIONS TOTAL",
                total_roxzone_label: "ROXZONE TOTAL",
                overall_prefix: "Overall: Top",
                percent_prefix: "Top %",
                run_label_prefix: "Run ",
                link_copied: "Link Copied!"
            }
        };

        // --- State ---
        let currentLang = 'tr';
        let times = {};

        // --- Helpers ---
        function formatMMSS(sec) {
            if (isNaN(sec)) return "00:00";
            return `${Math.floor(sec / 60).toString().padStart(2, '0')}:${(sec % 60).toString().padStart(2, '0')}`;
        }

        function formatHHMMSS(sec) {
            if (isNaN(sec)) return "00:00:00";
            const h = Math.floor(sec / 3600);
            const m = Math.floor((sec % 3600) / 60);
            const s = sec % 60;
            return `${h.toString().padStart(2, '0')}:${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
        }

        function calculatePct(time, p10, p90) {
            let pct = 10 + ((time - p10) / (p90 - p10)) * 80;
            return Math.max(0.1, Math.min(99.9, pct)).toFixed(1);
        }

        // --- Core Logic ---
        function init() {
            // Check for URL State first
            const urlParams = new URLSearchParams(window.location.search);
            const stateParam = urlParams.get('s');

            if (stateParam) {
                try {
                    times = JSON.parse(atob(stateParam));
                } catch(e) {
                    loadFromLocalStorage();
                }
            } else {
                loadFromLocalStorage();
            }

            // Fill defaults if missing
            Object.keys(STATION_DATA).forEach(key => {
                if (!key.includes('total') && typeof times[key] === 'undefined') {
                    times[key] = STATION_DATA[key].default;
                }
            });

            // Ensure sync input is clean on load
            const syncInput = document.getElementById('sync-input');
            if(syncInput) syncInput.value = "";

            // Initial Render
            renderControls();
            updateSummary();
            setLanguage('tr'); // Default lang
        }

        function loadFromLocalStorage() {
            const saved = localStorage.getItem('hyrox_sim_data_v4');
            if (saved) {
                try {
                    times = JSON.parse(saved);
                } catch(e) { times = {} }
            }
        }

        function saveData() {
            try {
                localStorage.setItem('hyrox_sim_data_v4', JSON.stringify(times));
            } catch(e) {
                console.error("Could not save to localStorage", e);
            }
        }

        function updateTime(key, val) {
            const data = STATION_DATA[key];
            let newVal = parseInt(val);
            // Clamp
            if (newVal < data.min) newVal = data.min;
            if (newVal > data.max) newVal = data.max;

            times[key] = newVal;
            
            // Update UI elements directly for performance
            document.getElementById(`range-${key}`).value = newVal;
            document.getElementById(`val-${key}`).innerText = formatMMSS(newVal);
            
            const pct = calculatePct(newVal, data.p10, data.p90);
            const prefix = TRANSLATIONS[currentLang].percent_prefix;
            document.getElementById(`pct-${key}`).innerText = `${prefix}${pct}`;
            
            saveData();
            updateSummary();
        }

        function syncRuns() {
            const input = document.getElementById('sync-input').value;
            if (!input) return;
            const parts = input.split(':');
            if (parts.length < 2) return;
            const baseSeconds = parseInt(parts[0]) * 60 + (parseInt(parts[1]) || 0);

            for (let i = 1; i <= 8; i++) {
                const factor = 1 + (i - 1) * 0.012;
                const key = `run${i}`;
                if (STATION_DATA[key]) {
                    const newVal = Math.round(baseSeconds * factor);
                    updateTime(key, newVal);
                }
            }
        }

        function updateSummary() {
            let runTotal = 0, workTotal = 0, roxTotal = times.roxzone || 0;

            Object.keys(times).forEach(key => {
                if (key.startsWith('run')) runTotal += times[key];
                else if (key.startsWith('ws')) workTotal += times[key];
            });

            const totalAll = runTotal + workTotal + roxTotal;
            const t = TRANSLATIONS[currentLang];

            // Values
            document.getElementById('val-total-time').innerText = formatHHMMSS(totalAll);
            document.getElementById('val-run-total').innerText = formatMMSS(runTotal);
            document.getElementById('val-work-total').innerText = formatMMSS(workTotal);
            document.getElementById('val-rox-total').innerText = formatMMSS(roxTotal);

            // Percentiles
            const totalPct = calculatePct(totalAll, STATION_DATA.totalAll.p10, STATION_DATA.totalAll.p90);
            document.getElementById('val-total-pct').innerText = `${t.overall_prefix} ${totalPct}%`;

            document.getElementById('pct-run-total').innerText = `${t.percent_prefix}${calculatePct(runTotal, STATION_DATA.totalRun.p10, STATION_DATA.totalRun.p90)}`;
            document.getElementById('pct-work-total').innerText = `${t.percent_prefix}${calculatePct(workTotal, STATION_DATA.totalWork.p10, STATION_DATA.totalWork.p90)}`;
            document.getElementById('pct-rox-total').innerText = `${t.percent_prefix}${calculatePct(roxTotal, STATION_DATA.totalRox.p10, STATION_DATA.totalRox.p90)}`;
        }

        function setLanguage(lang) {
            currentLang = lang;
            const t = TRANSLATIONS[lang];

            // Update Labels
            document.getElementById('lbl-runs-header').innerText = t.running_header;
            document.getElementById('lbl-workouts-header').innerText = t.workouts_header;
            document.getElementById('lbl-roxzone-header').innerText = t.roxzone_header;
            document.getElementById('lbl-sync-btn').innerText = t.sync_button;
            
            document.getElementById('lbl-total-time').innerText = t.total_time_label;
            document.getElementById('lbl-run-total').innerText = t.total_run_label;
            document.getElementById('lbl-work-total').innerText = t.total_workout_label;
            document.getElementById('lbl-rox-total').innerText = t.total_roxzone_label;
            document.getElementById('share-tooltip').innerText = t.link_copied;

            // Buttons visual state
            const btnTr = document.getElementById('btn-lang-tr');
            const btnEn = document.getElementById('btn-lang-en');
            const activeClass = "bg-brand text-black shadow-lg";
            const inactiveClass = "text-gray-400 hover:text-white bg-transparent shadow-none";

            if (lang === 'tr') {
                btnTr.className = `px-4 py-1.5 rounded-md text-xs font-bold transition-all ${activeClass}`;
                btnEn.className = `px-4 py-1.5 rounded-md text-xs font-bold transition-all ${inactiveClass}`;
            } else {
                btnTr.className = `px-4 py-1.5 rounded-md text-xs font-bold transition-all ${inactiveClass}`;
                btnEn.className = `px-4 py-1.5 rounded-md text-xs font-bold transition-all ${activeClass}`;
            }

            // Update individual item labels
            for(let i=1; i<=8; i++) {
                const lbl = document.getElementById(`lbl-run${i}`);
                if(lbl) lbl.innerText = `${t.run_label_prefix}${i}`;
            }

            // Refresh summary
            updateSummary();
            
            // Refresh individual percentages
             Object.keys(times).forEach(key => {
                 const data = STATION_DATA[key];
                 if(data) {
                    const pct = calculatePct(times[key], data.p10, data.p90);
                    document.getElementById(`pct-${key}`).innerText = `${t.percent_prefix}${pct}`;
                 }
             });
        }

        function toggleAccordion(contentId, chevronId) {
            const content = document.getElementById(contentId);
            const chevron = document.getElementById(chevronId);
            
            if (content.classList.contains('open')) {
                content.classList.remove('open');
                chevron.classList.remove('rotate');
            } else {
                content.classList.add('open');
                chevron.classList.add('rotate');
            }
        }

        function shareState() {
            const stateStr = btoa(JSON.stringify(times));
            const url = new URL(window.location.href.split('?')[0]);
            url.searchParams.set('s', stateStr);
            
            navigator.clipboard.writeText(url.toString()).then(() => {
                const tooltip = document.getElementById('share-tooltip');
                tooltip.classList.remove('opacity-0');
                setTimeout(() => tooltip.classList.add('opacity-0'), 2000);
            }).catch(err => {
                console.error('Could not copy text: ', err);
            });
        }

        // --- Rendering ---
        function createRangeControl(key, data, isWorkout) {
            const badgeHtml = (isWorkout && data.badge) 
                ? `<div class="bg-brand text-black text-xs font-bold w-6 h-6 flex items-center justify-center rounded-sm">${data.badge}</div>` 
                : '';
            
            const labelText = isWorkout ? data.label : `Run ${key.replace('run','')}`;

            return `
            <div class="bg-[#111] border border-gray-800 rounded-lg p-4 flex flex-col gap-3 hover:border-brand transition-colors group">
                <div class="flex justify-between items-center">
                    <div class="flex items-center gap-3">
                        ${badgeHtml}
                        <span id="lbl-${key}" class="text-sm font-bold text-gray-300 uppercase tracking-wider group-hover:text-white transition-colors">${labelText}</span>
                    </div>
                    <div class="flex items-center gap-3">
                        <span id="pct-${key}" class="text-[10px] font-bold text-brand">%50.0</span>
                        <span id="val-${key}" class="font-mono text-lg font-bold text-white">${formatMMSS(times[key])}</span>
                    </div>
                </div>
                <div class="flex items-center gap-3">
                    <button onclick="updateTime('${key}', times['${key}'] - 5)" class="w-8 h-8 flex items-center justify-center bg-black border border-gray-700 rounded text-gray-400 hover:text-brand hover:border-brand active:scale-95 transition-all">-</button>
                    <input 
                        type="range" 
                        id="range-${key}"
                        min="${data.min}" 
                        max="${data.max}" 
                        value="${times[key]}" 
                        oninput="updateTime('${key}', this.value)"
                        class="flex-1"
                    />
                    <button onclick="updateTime('${key}', times['${key}'] + 5)" class="w-8 h-8 flex items-center justify-center bg-black border border-gray-700 rounded text-gray-400 hover:text-brand hover:border-brand active:scale-95 transition-all">+</button>
                </div>
            </div>`;
        }

        function renderControls() {
            // Runs
            const runsHtml = [1,2,3,4,5,6,7,8].map(i => {
                const key = `run${i}`;
                return createRangeControl(key, STATION_DATA[key], false);
            }).join('');
            document.getElementById('runs-container').innerHTML = runsHtml;

            // Workouts
            const worksHtml = ['ws1','ws2','ws3','ws4','ws5','ws6','ws7','ws8'].map(key => {
                return createRangeControl(key, STATION_DATA[key], true);
            }).join('');
            document.getElementById('workouts-container').innerHTML = worksHtml;

            // Roxzone
            document.getElementById('roxzone-container').innerHTML = createRangeControl('roxzone', STATION_DATA.roxzone, false);
        }

        // --- Start ---
        init();

    </script>
</body>
</html>
