<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HYROX Performance Lab</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #050810;
            color: #f1f5f9;
            letter-spacing: -0.01em;
        }
        
        /* Slider thumb boyutu mobil için büyütüldü */
        input[type="range"] {
            -webkit-appearance: none;
            height: 3px;
            background: #1e293b;
            border-radius: 5px;
            cursor: pointer;
        }
        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 22px; /* Dokunma alanı büyütüldü */
            height: 22px;
            background: #fbbf24;
            border-radius: 50%;
            border: 2px solid #000;
            box-shadow: 0 0 10px rgba(0,0,0,0.5);
        }
        input[type="range"]::-moz-range-thumb {
            width: 22px;
            height: 22px;
            background: #fbbf24;
            border-radius: 50%;
            border: 2px solid #000;
        }

        .station-card {
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid rgba(51, 65, 85, 0.4);
        }

        .accordion-content {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.3s ease-out, opacity 0.3s ease;
            opacity: 0;
        }

        .accordion-content.open {
            max-height: 2000px; 
            opacity: 1;
            margin-top: 0.75rem;
        }

        .chevron {
            transition: transform 0.3s ease;
        }
        .chevron.rotated {
            transform: rotate(180deg);
        }

        .sticky-summary {
            position: sticky;
            top: 1rem;
            z-index: 50;
        }
        
        .font-mono-custom {
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
        }
    </style>
</head>
<body class="antialiased pb-10">

    <div class="max-w-4xl mx-auto px-4 pt-6">
        <!-- Header -->
        <div class="flex justify-between items-center mb-6">
            <div>
                <h1 class="text-xl font-black tracking-tight text-white italic">HYROX<span class="text-amber-500 text-base ml-1 font-medium not-italic">LAB</span></h1>
                <p class="text-[10px] text-slate-500 uppercase font-bold tracking-[0.2em] mt-0.5">Performance Pro</p>
            </div>
            <div class="flex bg-slate-900 rounded-lg p-0.5 text-[10px] font-bold border border-slate-800">
                <button id="lang-tr" onclick="switchLanguage('tr')" class="px-3 py-1.5 rounded-md transition-all">TR</button>
                <button id="lang-en" onclick="switchLanguage('en')" class="px-3 py-1.5 rounded-md transition-all ml-0.5">EN</button>
            </div>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-12 gap-4 items-start">
            
            <!-- Left: Inputs -->
            <div class="lg:col-span-7 space-y-3">
                
                <!-- Runs Accordion -->
                <section class="bg-slate-900/30 border border-slate-800/60 rounded-xl p-3">
                    <div class="flex items-center justify-between cursor-pointer" onclick="toggleAccordion('run-section', 'run-chevron')">
                        <h2 data-key="running_header" class="text-[11px] font-bold uppercase tracking-widest text-rose-500 flex items-center gap-2">
                            <span>🏃</span> 1KM RUNS
                        </h2>
                        <svg id="run-chevron" class="chevron w-4 h-4 text-slate-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>
                    </div>
                    
                    <div id="run-section" class="accordion-content">
                        <div class="flex gap-2 mb-3 bg-slate-950/50 p-2 rounded-lg items-center border border-slate-800/40">
                            <input type="text" id="sync-pace-input" placeholder="04:30" 
                                   class="flex-1 bg-transparent text-center text-sm py-1.5 rounded border-none focus:outline-none font-mono-custom text-white">
                            <button onclick="syncPaces()" data-key="sync_button" class="bg-rose-600 hover:bg-rose-700 text-white px-4 py-2 rounded-md text-xs font-bold transition-colors">SYNC</button>
                        </div>
                        <div id="running-grid" class="grid grid-cols-1 sm:grid-cols-2 gap-2">
                            <!-- JS Loaded -->
                        </div>
                    </div>
                </section>

                <!-- Workouts Accordion -->
                <section class="bg-slate-900/30 border border-slate-800/60 rounded-xl p-3">
                    <div class="flex items-center justify-between cursor-pointer" onclick="toggleAccordion('work-section', 'work-chevron')">
                        <h2 data-key="workouts_header" class="text-[11px] font-bold uppercase tracking-widest text-amber-500 flex items-center gap-2">
                            <span>🏋️</span> WORKOUTS
                        </h2>
                        <svg id="work-chevron" class="chevron w-4 h-4 text-slate-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>
                    </div>
                    <div id="work-section" class="accordion-content">
                        <div id="workout-grid" class="grid grid-cols-1 sm:grid-cols-2 gap-2">
                            <!-- JS Loaded -->
                        </div>
                    </div>
                </section>

                <!-- Roxzone Accordion -->
                <section class="bg-slate-900/30 border border-slate-800/60 rounded-xl p-3">
                    <div class="flex items-center justify-between cursor-pointer" onclick="toggleAccordion('rox-section', 'rox-chevron')">
                        <h2 data-key="roxzone_header" class="text-[11px] font-bold uppercase tracking-widest text-cyan-500 flex items-center gap-2">
                            <span>⏱️</span> ROXZONE
                        </h2>
                        <svg id="rox-chevron" class="chevron w-4 h-4 text-slate-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>
                    </div>
                    <div id="rox-section" class="accordion-content">
                        <div id="roxzone-container">
                            <!-- JS Loaded -->
                        </div>
                    </div>
                </section>
            </div>

            <!-- Right: Results Panel -->
            <div class="lg:col-span-5">
                <div class="sticky-summary bg-slate-950 border border-amber-500/20 rounded-2xl p-5 shadow-2xl">
                    <div class="text-center mb-5">
                        <span data-key="total_time_label" class="text-[10px] font-bold text-slate-500 uppercase tracking-[0.2em]">Tahmini Bitiş Süresi</span>
                        <div id="total-time-display" class="font-mono-custom text-4xl md:text-5xl font-black text-white mt-2 tracking-tighter">00:00:00</div>
                        <div id="total-percentile-display" class="mt-4 inline-block px-4 py-2 rounded-full text-xs font-bold bg-amber-500 text-black shadow-lg shadow-amber-500/20">
                            Overall: Top 50.0%
                        </div>
                    </div>

                    <div class="space-y-2">
                        <div class="bg-slate-900/40 p-3 rounded-lg flex justify-between items-center border border-slate-800/40">
                            <div>
                                <div data-key="total_run_label" class="text-[10px] font-black text-rose-500 uppercase tracking-wider">Run Total</div>
                                <div id="total-running-time" class="font-mono-custom text-sm font-bold text-white">00:00</div>
                            </div>
                            <div id="total-running-percentile" class="text-[11px] font-bold text-slate-400 bg-slate-950 px-2 py-0.5 rounded-md border border-slate-800">Top 50%</div>
                        </div>
                        <div class="bg-slate-900/40 p-3 rounded-lg flex justify-between items-center border border-slate-800/40">
                            <div>
                                <div data-key="total_workout_label" class="text-[10px] font-black text-amber-500 uppercase tracking-wider">Station Total</div>
                                <div id="total-workout-time" class="font-mono-custom text-sm font-bold text-white">00:00</div>
                            </div>
                            <div id="total-workout-percentile" class="text-[11px] font-bold text-slate-400 bg-slate-950 px-2 py-0.5 rounded-md border border-slate-800">Top 50%</div>
                        </div>
                        <div class="bg-slate-900/40 p-3 rounded-lg flex justify-between items-center border border-slate-800/40">
                            <div>
                                <div data-key="total_roxzone_label" class="text-[10px] font-black text-cyan-500 uppercase tracking-wider">Roxzone Total</div>
                                <div id="total-roxzone-time" class="font-mono-custom text-sm font-bold text-white">00:00</div>
                            </div>
                            <div id="total-roxzone-percentile" class="text-[11px] font-bold text-slate-400 bg-slate-950 px-2 py-0.5 rounded-md border border-slate-800">Top 50%</div>
                        </div>
                    </div>
                    
                    <div class="mt-5 pt-4 border-t border-slate-900 text-center">
                        <p class="text-[10px] text-slate-600 italic font-medium">HYResult verileriyle optimize edilmiştir.</p>
                    </div>
                </div>
            </div>

        </div>
    </div>

    <script>
        const translations = {
            'tr': {
                running_header: "🏃 KOŞULAR (1KM x 8)",
                sync_button: "EŞİTLE",
                workouts_header: "🏋️ İSTASYONLAR",
                roxzone_header: "⏱️ ROXZONE (GEÇİŞLER)",
                total_time_label: "TAHMİNİ BİTİŞ SÜRESİ",
                total_run_label: "KOŞU TOPLAMI",
                total_workout_label: "İSTASYON TOPLAMI",
                total_roxzone_label: "ROXZONE TOPLAMI",
                overall_prefix: "Genel: İlk %",
                stations: {
                    run1: "Run 1", run2: "Run 2", run3: "Run 3", run4: "Run 4",
                    run5: "Run 5", run6: "Run 6", run7: "Run 7", run8: "Run 8",
                    ws1: "SkiErg", ws2: "Sled Push", ws3: "Sled Pull", ws4: "Burpees",
                    ws5: "Row", ws6: "Farmers", ws7: "Lunges", ws8: "Wall Balls",
                    roxzone: "Transitions"
                }
            },
            'en': {
                running_header: "🏃 RUNS (1KM x 8)",
                sync_button: "SYNC",
                workouts_header: "🏋️ WORKOUTS",
                roxzone_header: "⏱️ ROXZONE",
                total_time_label: "ESTIMATED FINISH TIME",
                total_run_label: "RUN TOTAL",
                total_workout_label: "STATIONS TOTAL",
                total_roxzone_label: "ROXZONE TOTAL",
                overall_prefix: "Overall: Top %",
                stations: {
                    run1: "Run 1", run2: "Run 2", run3: "Run 3", run4: "Run 4",
                    run5: "Run 5", run6: "Run 6", run7: "Run 7", run8: "Run 8",
                    ws1: "SkiErg", ws2: "Sled Push", ws3: "Sled Pull", ws4: "Burpees",
                    ws5: "Row", ws6: "Farmers", ws7: "Lunges", ws8: "Wall Balls",
                    roxzone: "Transitions"
                }
            }
        };

        const stationData = {
            run1: { default: 270, p10: 210, p90: 380, min: 180, max: 480 },
            run2: { default: 280, p10: 215, p90: 390, min: 180, max: 480 },
            run3: { default: 290, p10: 220, p90: 400, min: 180, max: 500 },
            run4: { default: 300, p10: 225, p90: 410, min: 180, max: 500 },
            run5: { default: 300, p10: 230, p90: 420, min: 180, max: 500 },
            run6: { default: 310, p10: 235, p90: 430, min: 180, max: 520 },
            run7: { default: 310, p10: 240, p90: 440, min: 180, max: 520 },
            run8: { default: 330, p10: 260, p90: 480, min: 180, max: 600 },
            ws1: { default: 265, p10: 230, p90: 290, min: 180, max: 360 },
            ws2: { default: 170, p10: 120, p90: 280, min: 60, max: 420 },
            ws3: { default: 280, p10: 200, p90: 460, min: 100, max: 600 },
            ws4: { default: 320, p10: 230, p90: 550, min: 120, max: 720 },
            ws5: { default: 285, p10: 250, p90: 320, min: 200, max: 380 },
            ws6: { default: 120, p10: 90,  p90: 180, min: 60, max: 240 },
            ws7: { default: 290, p10: 200, p90: 520, min: 120, max: 720 },
            ws8: { default: 380, p10: 270, p90: 620, min: 180, max: 900 },
            roxzone: { default: 360, p10: 270, p90: 660, min: 120, max: 1200 },
            totalRun: { p10: 1800, p90: 3300 },
            totalWork: { p10: 1800, p90: 3000 },
            totalRox: { p10: 270,  p90: 660 },
            totalAll: { p10: 4200, p90: 6800 }
        };

        let currentLang = 'tr';

        function toggleAccordion(id, chevronId) {
            const el = document.getElementById(id);
            const chevron = document.getElementById(chevronId);
            el.classList.toggle('open');
            chevron.classList.toggle('rotated');
        }

        function formatMMSS(sec) {
            return `${Math.floor(sec/60).toString().padStart(2, '0')}:${(sec%60).toString().padStart(2, '0')}`;
        }

        function formatHHMMSS(sec) {
            const h = Math.floor(sec/3600);
            const m = Math.floor((sec%3600)/60);
            const s = sec%60;
            return `${h.toString().padStart(2, '0')}:${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
        }

        function calculatePct(time, p10, p90) {
            let pct = 10 + ((time - p10) / (p90 - p10)) * 80;
            return Math.max(0.1, Math.min(99.9, pct)).toFixed(1);
        }

        function getPctColor(pct) {
            if (pct <= 20) return 'text-emerald-500';
            if (pct <= 50) return 'text-amber-500';
            return 'text-rose-500';
        }

        function adjust(id, delta) {
            const slider = document.getElementById(id);
            slider.value = parseInt(slider.value) + delta;
            update();
        }

        function update() {
            let tr = 0, tw = 0, trx = 0;
            const lp = translations[currentLang];

            for (const key in stationData) {
                if (key.includes('total')) continue;
                const el = document.getElementById(key);
                if (!el) continue;
                
                const val = parseInt(el.value);
                const data = stationData[key];
                
                document.getElementById(`${key}-val`).innerText = formatMMSS(val);
                const pct = calculatePct(val, data.p10, data.p90);
                const pctEl = document.getElementById(`${key}-pct`);
                pctEl.innerText = `${currentLang === 'tr' ? '%' : 'Top %'}${pct}`;
                pctEl.className = `text-[10px] font-bold ${getPctColor(pct)}`;

                if (key.startsWith('run')) tr += val;
                else if (key.startsWith('ws')) tw += val;
                else trx += val;
            }

            const total = tr + tw + trx;
            document.getElementById('total-time-display').innerText = formatHHMMSS(total);
            
            const overallPct = calculatePct(total, stationData.totalAll.p10, stationData.totalAll.p90);
            document.getElementById('total-percentile-display').innerText = `${lp.overall_prefix}${overallPct}`;
            
            document.getElementById('total-running-time').innerText = formatMMSS(tr);
            document.getElementById('total-running-percentile').innerText = `${currentLang === 'tr' ? '%' : 'Top %'}${calculatePct(tr, stationData.totalRun.p10, stationData.totalRun.p90)}`;
            
            document.getElementById('total-workout-time').innerText = formatMMSS(tw);
            document.getElementById('total-workout-percentile').innerText = `${currentLang === 'tr' ? '%' : 'Top %'}${calculatePct(tw, stationData.totalWork.p10, stationData.totalWork.p90)}`;
            
            document.getElementById('total-roxzone-time').innerText = formatMMSS(trx);
            document.getElementById('total-roxzone-percentile').innerText = `${currentLang === 'tr' ? '%' : 'Top %'}${calculatePct(trx, stationData.totalRox.p10, stationData.totalRox.p90)}`;
        }

        function createUI() {
            const grids = {
                run: document.getElementById('running-grid'),
                ws: document.getElementById('workout-grid'),
                rox: document.getElementById('roxzone-container')
            };

            Object.entries(stationData).forEach(([key, data]) => {
                if (key.includes('total')) return;

                const type = key.startsWith('run') ? 'run' : (key.startsWith('ws') ? 'ws' : 'rox');
                const html = `
                    <div class="station-card p-3 rounded-lg border border-slate-800/40 shadow-sm">
                        <div class="flex justify-between items-center mb-2">
                            <span data-key="${key}" class="text-[10px] font-black text-slate-500 uppercase tracking-widest"></span>
                            <div class="flex items-center gap-2">
                                <span id="${key}-pct" class="text-[10px] font-bold"></span>
                                <span id="${key}-val" class="font-mono-custom text-xs font-bold text-white tracking-widest bg-slate-900 px-2 py-0.5 rounded">00:00</span>
                            </div>
                        </div>
                        <div class="flex items-center gap-3">
                            <button onclick="adjust('${key}', -5)" class="w-8 h-8 flex items-center justify-center bg-slate-900 rounded-md text-xs font-bold active:scale-95 transition-transform border border-slate-800">-</button>
                            <input type="range" id="${key}" min="${data.min}" max="${data.max}" value="${data.default}" class="flex-1" oninput="update()">
                            <button onclick="adjust('${key}', 5)" class="w-8 h-8 flex items-center justify-center bg-slate-900 rounded-md text-xs font-bold active:scale-95 transition-transform border border-slate-800">+</button>
                        </div>
                    </div>
                `;
                grids[type].innerHTML += html;
            });
        }

        function switchLanguage(lang) {
            currentLang = lang;
            const lp = translations[lang];
            
            document.querySelectorAll('[data-key]').forEach(el => {
                const key = el.dataset.key;
                el.innerText = lp[key] || lp.stations[key] || key;
            });

            document.getElementById('lang-tr').className = lang === 'tr' ? 'px-3 py-1.5 rounded-md bg-white text-slate-950 shadow-lg' : 'px-3 py-1.5 rounded-md text-slate-500 hover:text-white';
            document.getElementById('lang-en').className = lang === 'en' ? 'px-3 py-1.5 rounded-md bg-white text-slate-950 shadow-lg' : 'px-3 py-1.5 rounded-md text-slate-500 hover:text-white';

            update();
        }

        function syncPaces() {
            const val = document.getElementById('sync-pace-input').value;
            const parts = val.split(':');
            if(parts.length < 2) return;
            const sec = parseInt(parts[0]) * 60 + (parseInt(parts[1]) || 0);
            
            for(let i=1; i<=8; i++) {
                const slider = document.getElementById(`run${i}`);
                if(slider) {
                    let factor = 1 + (i-1)*0.012;
                    slider.value = Math.round(sec * factor);
                }
            }
            update();
        }

        window.onload = () => {
            createUI();
            switchLanguage('tr');
        };
    </script>
</body>
</html>
